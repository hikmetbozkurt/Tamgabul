[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/runtime",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
ts-rs = "10"
tempfile = "3"
