[package]
name = "tamgabul-core"
description = "Tamgabul core: model status, app health, typed IPC DTOs, SQLite migrations"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite.workspace = true
ts-rs.workspace = true
blake3 = "1"
pdf-extract = "0.12"
# Portable image decoding (all common formats) + resize + PNG re-encode.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp", "pnm", "tga", "dds", "hdr", "exr", "qoi"] }
# Portable audio decoding: MP3, AAC/M4A, FLAC, ALAC, Vorbis, WAV, AIFF, CAF, MKV/WebM.
symphonia = { version = "0.5", features = ["all"] }
# Office Open XML / OpenDocument are zip archives.
zip = { version = "2", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
# Legacy Office (.doc/.xls/.ppt): OLE compound files; .xls cells via calamine.
cfb = "0.14"
calamine = "0.30"

[dev-dependencies]
tempfile.workspace = true
