[package]
name = "tamgabul-desktop"
description = "Tamgabul desktop host (Tauri v2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
tamgabul-core = { path = "../../../crates/core" }
tamgabul-platform = { path = "../../../crates/platform" }
tamgabul-runtime = { path = "../../../crates/runtime" }
# Folder watching (ReadDirectoryChangesW on Windows, FSEvents on macOS).
notify = "8"
