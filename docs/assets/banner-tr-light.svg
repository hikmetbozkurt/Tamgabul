  <text x="234" y="214" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="26" fill="#6B7079">Dosyalarını tarif ederek bul. Çevrimdışı, kendi bilgisayarında.</text>

