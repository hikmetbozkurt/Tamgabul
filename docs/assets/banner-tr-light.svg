  <rect width="1280" height="400" rx="24" fill="#F7F7F5"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)" opacity="0.7"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- app mark: the drop from the app icon -->
  <g transform="translate(96 112)">
    <rect width="104" height="104" rx="26" fill="#1F2533"/>
    <path d="M52 22 C52 22 26 52 26 68 a26 26 0 0 0 52 0 C78 52 52 22 52 22 Z" fill="#FFFFFF"/>
